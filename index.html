<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BFTIMER</title>
<meta name="description" content="A huge blocky neon countdown timer.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04070d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <main class="stage" id="stage">
    <canvas id="clock" aria-label="Countdown clock"></canvas>
    <p class="clock-readout" id="readout" role="status" aria-live="polite"></p>
  </main>

  <footer class="controls">
    <button class="chip" data-length="3000">50 MIN</button>
    <button class="chip" data-length="600">10 MIN</button>
    <button class="chip go" id="toggle">START</button>
    <button class="chip" id="reset">RESET</button>
  </footer>

</div>

<span class="version" aria-hidden="true">v1.5</span>

<div class="flash" id="flash" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
